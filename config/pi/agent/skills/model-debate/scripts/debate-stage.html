<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Debate Stage</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14151c;
    --panel: #1f2130;
    --border: #3a3d55;
    --fg: #e8e8f0;
    --muted: #9a9cb5;
    --accent: #ffd166;
    font-family: ui-monospace, "SF Mono", Menlo, "D2Coding", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  main { max-width: 980px; margin: 0 auto; padding: 0 16px 16px; display: grid; gap: 12px; }
  /* Header controls and the stage stay pinned while the panels below scroll. The stage shrinks
     to keep at least ~30% of the window for the panels. */
  .pinned { position: sticky; top: 0; z-index: 10; display: grid; gap: 12px; padding: 16px 0 12px; background: var(--bg); box-shadow: 0 8px 12px -10px rgb(0 0 0 / 0.6); }
  .pinned .stage { width: min(100%, calc((70vh - 90px) * 16 / 9)); justify-self: center; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  h1 { font-size: 16px; margin: 0; flex: 1 1 320px; overflow-wrap: anywhere; }
  .chip { border: 2px solid var(--border); padding: 2px 8px; font-size: 13px; background: var(--panel); }
  .chip.live::before { content: "● "; color: #6bd968; }
  .chip.offline::before { content: "● "; color: #ff6b6b; }
  button {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--panel);
    border: 2px solid var(--border); padding: 2px 10px; cursor: pointer;
  }
  button:hover:not(:disabled), button:focus-visible { border-color: var(--accent); outline: none; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .stage { position: relative; aspect-ratio: 16 / 9; border: 4px solid var(--border); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .bubble {
    position: absolute; max-width: 46%; padding: 8px 10px; font-size: 14px; line-height: 1.45;
    background: #fffdf5; color: #1b1b24; border: 3px solid #1b1b24;
    box-shadow: 4px 4px 0 rgb(0 0 0 / 0.35); overflow-wrap: anywhere;
  }
  .bubble[hidden] { display: none; }
  .bubble .who { display: block; font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .bubble::after {
    content: ""; position: absolute; bottom: -12px; left: var(--tail, 50%); translate: -50% 0;
    border: 6px solid transparent; border-top-color: #1b1b24;
  }
  .bubble.from-top::after { top: -12px; bottom: auto; border-top-color: transparent; border-bottom-color: #1b1b24; }
  .banner {
    position: absolute; top: 8px; left: 50%; translate: -50% 0; max-width: 80%;
    padding: 6px 12px; font-size: 13px; text-align: center; background: rgb(20 21 28 / 0.85);
    border: 2px solid var(--accent); color: var(--accent);
  }
  .banner[hidden] { display: none; }
  .tag { position: absolute; bottom: 2%; translate: -50% 0; font-size: 13px; font-weight: 700; text-shadow: 2px 2px 0 #000; white-space: pre; text-align: center; line-height: 1.3; }
  .log {
    border: 2px solid var(--border); background: var(--panel); padding: 8px 12px;
    max-height: 260px; overflow-y: auto; font-size: 13px; line-height: 1.5;
  }
  .log p { margin: 0 0 4px; }
  .log .meta { color: var(--muted); }
  .dir { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .badge { display: inline-block; margin-left: 6px; padding: 0 5px; font-size: 11px; font-weight: 700; color: #14151c; vertical-align: 1px; }
  .badge[hidden] { display: none; }
  .badge.keep { background: #9ad1ff; }
  .badge.revise, .badge.withdraw { background: #ffd166; }
  .bubble.fact-verified { border-color: #2f9e44; }
  .bubble.fact-refuted { border-color: #d62828; }
  .bubble.fact-open { border-color: #868e96; }
  .facts { list-style: none; padding: 0; margin: 0; }
  .facts li { margin-bottom: 8px; }
  .facts .quote { display: block; color: var(--muted); font-size: 13px; }
  .fact-mark { display: inline-block; min-width: 76px; margin-right: 6px; padding: 0 4px; font-size: 11px; font-weight: 700; text-align: center; color: #14151c; }
  .fact-mark.verified { background: #6bd968; }
  .fact-mark.refuted { background: #ff6b6b; }
  .fact-mark.open { background: var(--muted); }
  .panel { border: 2px solid var(--border); background: var(--panel); padding: 10px 14px; font-size: 14px; line-height: 1.55; }
  .panel h2 { font-size: 15px; margin: 0 0 8px; color: var(--accent); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .panel-head h2 { margin: 0; }
  .panel-head button[hidden] { display: none; }
  .panel h3 { font-size: 14px; margin: 12px 0 6px; }
  .panel h4, .panel h5, .panel h6 { font-size: 13px; margin: 10px 0 4px; }
  .panel p { margin: 0 0 6px; }
  .panel ul, .panel ol { margin: 0 0 8px; padding-left: 22px; }
  .panel li { margin-bottom: 3px; }
  .panel a { color: #8ecbff; }
  .panel code { background: #2a2d42; padding: 0 4px; }
  .panel .tldr { border-left: 4px solid var(--accent); padding-left: 8px; font-weight: 700; }
  .empty { color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .card { border: 2px solid var(--border); padding: 8px 10px; background: var(--bg); }
  .card h4 { margin: 0 0 4px; font-size: 14px; }
  .card .verdict { color: var(--muted); font-size: 13px; }
  .card ul { list-style: none; padding: 0; margin: 6px 0 0; }
  .card li { font-size: 13px; margin-bottom: 6px; }
  .sev { display: inline-block; min-width: 58px; margin-right: 6px; padding: 0 4px; font-size: 11px; font-weight: 700; text-align: center; color: #14151c; }
  .sev.critical { background: #ff6b6b; }
  .sev.major { background: #ffb347; }
  .sev.minor { background: #9ad1ff; }
  .sev.note { background: var(--muted); }
  .counts { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; }
</style>
</head>
<body>
<main>
  <div class="pinned">
  <header>
    <h1 id="topic">Model Debate</h1>
    <span class="chip" id="phase">Connecting…</span>
    <span class="chip offline" id="conn">offline</span>
    <button type="button" id="pause" aria-pressed="false">Pause</button>
    <button type="button" id="clear" disabled title="Empty the panels below (enabled once the debate has finished)">Clear</button>
    <button type="button" id="replay" disabled title="Replay the whole debate from the brief (enabled once the debate has finished)">Replay</button>
    <button type="button" id="speed" disabled title="Playback speed (enabled while a replay is playing)">Speed 1×</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="canvas" width="160" height="90" role="img" aria-label="Pixel-art animation of Geppetto, Clark and Rocky debating"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="bubble" id="bubble" hidden aria-live="polite"><span class="who"><span id="who"></span><span class="badge" id="badge" hidden></span></span><span id="said"></span></div>
  </div>
  </div>
  <section class="log" id="log" aria-label="Transcript"></section>
  <section class="panel" aria-labelledby="facts-title">
    <h2 id="facts-title">Fact check</h2>
    <div id="facts"><p class="empty">No facts checked yet.</p></div>
  </section>
  <section class="panel" aria-labelledby="synthesis-title">
    <div class="panel-head">
      <h2 id="synthesis-title">Synthesis</h2>
      <button type="button" id="copy-synthesis" hidden title="Copy synthesis.md as Markdown">Copy</button>
    </div>
    <div id="synthesis"><p class="empty">No synthesis yet.</p></div>
  </section>
  <section class="panel" aria-labelledby="reviews-title">
    <h2 id="reviews-title">Reviews</h2>
    <div id="reviews"><p class="empty">No reviews yet.</p></div>
  </section>
  <div class="dir" id="dir"></div>
</main>
<script>
"use strict";
const W = 160, H = 90, FLOOR = 78;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

// 16x18 sprites. Letters map to the palette; "." is transparent.
const CHARACTERS = {
  "debate-gpt": {
    name: "Geppetto", model: "GPT", cx: 30, color: "#10a37f",
    palette: { G: "#10a37f", A: "#c9a26b", W: "#f4f4f4", S: "#f1c27d", K: "#222222", N: "#e0a96d", M: "#7a3b2e", B: "#5b3a29" },
    eyes: [[5, 5], [10, 5]], lid: "S", eyeBg: "S",
    sprite: [
      "................",
      ".....GGGGGG.....",
      "....GGGGGGGG....",
      "...GGGGGGGGGG...",
      "...WSSSSSSSSW...",
      "..WWSKSSSSKSWW..",
      "..WWSSSSSSSSWW..",
      "...WSSSNNSSSW...",
      "...WWWWWWWWWW...",
      "....WWWMMWWW....",
      ".....WWWWWW.....",
      "......WWWW......",
      "....GGGGGGGG....",
      "...GGGAAAAGGG...",
      "..SGGGAAAAGGGS..",
      "..SGGGAAAAGGGS..",
      "....BBB..BBB....",
      "....BBB..BBB....",
    ],
  },
  "debate-opus": {
    name: "Clark", model: "Claude Opus", cx: 80, color: "#d97757",
    // Superman: forehead curl, blue suit, red cape and boots, yellow-red "S" shield.
    palette: { H: "#1a1a2e", S: "#f1c27d", K: "#222222", N: "#d9a066", M: "#7a3b2e", B: "#2457c5", R: "#d62828", Y: "#ffd23f" },
    eyes: [[5, 6], [10, 6]], lid: "S", eyeBg: "S",
    sprite: [
      "................",
      "....HHHHHHHH....",
      "...HHHHHHHHHH...",
      "...HHSSSHSSHH...",
      "...HSSSSSSSSH...",
      "...SSSSSSSSSS...",
      "...SSKSSSSKSS...",
      "...SSSSNNSSSS...",
      "....SSSSSSSS....",
      "....SSSMMSSS....",
      ".....SSSSSS.....",
      "......SSSS......",
      ".RRBBBBBBBBBBRR.",
      ".RRBBBRYYRBBBRR.",
      ".RSBBBYRRYBBBSR.",
      ".RRBBBRRRRBBBRR.",
      ".RR.BBB..BBB.RR.",
      "....RRR..RRR....",
    ],
  },
  "debate-grok": {
    name: "Rocky", model: "Grok Fast", cx: 130, color: "#a9b0bc",
    // Rocky Balboa: short dark hair, heavy brows, red gloves, blue trunks with white trim.
    palette: { H: "#2b1d14", S: "#e0ac7e", K: "#1b1b1b", N: "#c48a5e", M: "#6b2a1e", G: "#c1121f", W: "#f4f4f4", T: "#1f3a93", D: "#1b1b1b" },
    eyes: [[6, 6], [9, 6]], lid: "S", eyeBg: "S",
    sprite: [
      "................",
      "................",
      ".....HHHHHH.....",
      "....HHHHHHHH....",
      "....HSSSSSSH....",
      "...SHHHSSHHHS...",
      "...SSSKSSKSSS...",
      "...SSSSNNSSSS...",
      "....SSSNNSSS....",
      "....SSSMMSSS....",
      ".....SSSSSS.....",
      "......SSSS......",
      "..SSSSSSSSSSSS..",
      ".GGSSSNSSNSSSGG.",
      "GGGGSSSSSSSSGGGG",
      ".GG.WTTTTTTW.GG.",
      "....SSS..SSS....",
      "....DDD..DDD....",
    ],
  },
};
const MOUTH = [[7, 9], [8, 9]];
const SPRITE_H = 18;
const HEAD_ROWS = 12; // sprite rows above the shoulders; they turn toward the partner

// Flying narrators. Inspector Gadget drops in from the top on his Go Go Gadget Copter for each
// fact check and flies back up; Grogu flies in from the left in his hover pram for the synthesis
// and leaves to the right; Cuzi, an AI robot (curiosity + question), jets in from the right to pose the question (brief) and
// jets back out. All dock at the top centre and speak in their own bubble.
const NARRATORS = {
  robot: {
    name: "Cuzi", labelColor: "#1f8a9e", cx: 80, top: 5, path: "from-right", lid: "K",
    palette: { L: "#ff5c5c", A: "#9aa3ad", H: "#c9d1d9", h: "#8b949e", K: "#2b2f36", E: "#5ce1e6", M: "#2b2f36", B: "#7d8590", C: "#ffd166", J: "#555555" },
    eyes: [[4, 5], [5, 5], [10, 5], [11, 5]],
    mouth: [[5, 7], [6, 7], [7, 7], [8, 7], [9, 7], [10, 7]],
    sprite: [
      "........L.......",
      "........A.......",
      "...HHHHHHHHHH...",
      "..HHHHHHHHHHHH..",
      "..HKKKKKKKKKKH..",
      "..HKEEKKKKEEKH..",
      "..HKKKKKKKKKKH..",
      "..HHHMMMMMMHHH..",
      "...hhhhhhhhhh...",
      "......hhhh......",
      "..BBBBBBBBBBBB..",
      ".hBBBBBCCBBBBBh.",
      ".hBBBBBCCBBBBBh.",
      "..BBBBBBBBBBBB..",
      "...JJJ....JJJ...",
    ],
    blinkAt: 0,
  },
  gadget: {
    name: "Inspector Gadget", labelColor: "#6b5a2e", cx: 80, top: 5, path: "vertical", lid: "S",
    palette: { H: "#8d8f94", h: "#4a4a4f", S: "#f1c27d", K: "#222222", N: "#d9a066", M: "#7a3b2e", C: "#c9a66b", c: "#a8874f", B: "#6b4f2a", T: "#6e7078", D: "#2b2b2b" },
    eyes: [[5, 4], [10, 4]],
    mouth: [[7, 6], [8, 6]],
    sprite: [
      "....HHHHHHHH....",
      "...HHHHHHHHHH...",
      ".HHhhhhhhhhhhHH.",
      "....SSSSSSSS....",
      "....SKSSSSKS....",
      "....SSSNNSSS....",
      "....SSSMMSSS....",
      ".....SSSSSS.....",
      "....CCCSSCCC....",
      "...CCCCCCCCCC...",
      "..CCCCcCCcCCCC..",
      "..SCCCcCCcCCCS..",
      "...CCCBBBBCCC...",
      "...CCCCCCCCCC...",
      "....CCCCCCCC....",
      "....TTT..TTT....",
      "....TTT..TTT....",
      "...DDDD..DDDD...",
    ],
    blinkAt: 0,
  },
  grogu: {
    name: "Grogu", labelColor: "#4f8a3d", cx: 80, top: 3, path: "horizontal", lid: "G",
    palette: { G: "#8fbf7a", D: "#6a9a5a", P: "#e8a6a0", K: "#111111", W: "#ffffff", S: "#c9ced6", s: "#8a9099", L: "#7fd4ff" },
    eyes: [[6, 4], [7, 4], [12, 4], [13, 4], [6, 5], [12, 5]],
    mouth: [[9, 7], [10, 7]],
    sprite: [
      "......GGGGGGGG......",
      ".....GGGGGGGGGG.....",
      "GG..GGGGGGGGGGGG..GG",
      "GPGGGGGGGGGGGGGGGGPG",
      ".GPPGGKKGGGGKKGGPPG.",
      "..GGGGKWGGGGKWGGGG..",
      "....GGGGGDDGGGGG....",
      ".....GGGGDDGGGG.....",
      ".SSSSSSSSSSSSSSSSSS.",
      "SSSLSSSSSSSSSSSSLSSS",
      ".sSSSSSSSSSSSSSSSSs.",
      "..ssssssssssssssss..",
    ],
    blinkAt: 0,
  },
};
const FLY_MS = 1600;
const narratorOf = (key) =>
  key === "brief.md" ? "robot" : key === "synthesis.md" ? "grogu" : key.startsWith("facts.md#") ? "gadget" : null;
// at: 0 = off-screen before entering, 1 = docked, 2 = off-screen after leaving.
const resetFlyers = () => Object.fromEntries(Object.keys(NARRATORS).map((n) => [n, { mode: "gone", at: 0, t0: 0 }]));
let flyers = resetFlyers();

function fly(n, mode, now) { flyers[n] = { mode, at: mode === "enter" ? 0 : 1, t0: now }; }

function updateFlyers(now) {
  for (const f of Object.values(flyers)) {
    if (f.mode !== "enter" && f.mode !== "exit") continue;
    const p = reduceMotion.matches ? 1 : Math.min(1, (now - f.t0) / (FLY_MS / speed));
    f.at = f.mode === "enter" ? 1 - (1 - p) ** 3 : 1 + p ** 3;
    if (p >= 1) f.mode = f.mode === "enter" ? "talk" : "gone";
  }
}

function narratorPos(N, at) {
  const lerp = (a, b, t) => a + (b - a) * t;
  if (N.path === "horizontal") {
    const x = at <= 1 ? lerp(-14, N.cx, at) : lerp(N.cx, W + 14, at - 1);
    return { x, y: N.top };
  }
  if (N.path === "from-right") {
    const x = at <= 1 ? lerp(W + 14, N.cx, at) : lerp(N.cx, W + 14, at - 1);
    return { x, y: N.top };
  }
  const off = -N.sprite.length - 6;
  return { x: N.cx, y: at <= 1 ? lerp(off, N.top, at) : lerp(N.top, off, at - 1) };
}

function drawNarrator(n, now) {
  const f = flyers[n], N = NARRATORS[n];
  if (f.mode === "gone") return;
  const motion = !reduceMotion.matches && !paused;
  const flying = f.mode === "enter" || f.mode === "exit";
  const bob = motion ? Math.round(Math.sin(now / 400)) : 0;
  const pos = narratorPos(N, f.at);
  const w = N.sprite[0].length;
  const x0 = Math.round(pos.x) - w / 2, y0 = Math.round(pos.y) + bob;
  if (n === "grogu" && flying && motion) {
    // Thruster glow trails behind the pram (he always flies left to right).
    const t = Math.floor(now / 80) % 2;
    px(x0 - 2 - t, y0 + 9, "#ffb347", 2 + t, 1);
    px(x0 - 1, y0 + 10, "#ffd166", 1, 1);
  }
  if (n === "gadget") {
    // Go Go Gadget Copter: a pole out of the hat and spinning blades.
    px(x0 + 7, y0 - 2, "#555555", 2, 2);
    const spin = motion ? Math.floor(now / 70) % 2 : 0;
    if (spin) px(x0 + 1, y0 - 3, "#e6e6e6", 14, 1);
    else px(x0 + 5, y0 - 3, "#e6e6e6", 6, 1);
  }
  if (n === "robot" && motion) {
    // Thrusters fire while flying, idle glow while hovering.
    const t = Math.floor(now / 80) % 2;
    const flame = flying ? 2 + t : t;
    if (flame) for (const fx of [4, 11]) px(x0 + fx, y0 + 15, flying ? "#ffb347" : "#7fd4ff", 1, flame);
  }
  N.sprite.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) if (row[x] !== ".") px(x0 + x, y0 + y, N.palette[row[x]]);
  });
  // Robot's antenna light blinks.
  if (n === "robot" && motion && Math.floor(now / 500) % 2) px(x0 + 8, y0, "#ffd1d1");
  if (motion && now > N.blinkAt) {
    for (const [x, y] of N.eyes) px(x0 + x, y0 + y, N.palette[N.lid]);
    if (now > N.blinkAt + 160) N.blinkAt = now + 3000 + Math.random() * 3000;
  }
  const talking = current && current.narrator === n;
  const mouthColor = { grogu: "#3d5a33", gadget: "#3a1a12", robot: "#5ce1e6" }[n];
  if (talking && (!motion || Math.floor(now / 160) % 2)) for (const [x, y] of N.mouth) px(x0 + x, y0 + y, mouthColor);
  // Repulsor shimmer under Grogu's pram while it hovers.
  if (n === "grogu" && motion && !flying) for (let i = 0; i < 3; i++) px(x0 + 5 + i * 5, y0 + 13 + ((Math.floor(now / 200) + i) % 2), "#cfe8ff");
}

// -1 = look left, 1 = look right, 0 = face the audience. The speaker looks at the panelist it
// addresses and that panelist looks back; everyone else faces forward.
function facing(id, c) {
  if (!current || !current.speaker || !current.target) return 0;
  const other = current.speaker === id ? current.target : current.target === id ? current.speaker : null;
  const o = other && CHARACTERS[other];
  return o ? Math.sign(o.cx - c.cx) : 0;
}

const $ = (id) => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d");
const stage = $("stage"), bubble = $("bubble"), banner = $("banner");

for (const [id, c] of Object.entries(CHARACTERS)) {
  c.blinkAt = performance.now() + 1000 + Math.random() * 3000;
  c.tag = document.createElement("span");
  c.tag.className = "tag";
  c.tag.style.left = (c.cx / W * 100) + "%";
  c.tag.style.color = c.color;
  c.tag.textContent = c.name + " (" + c.model + ")";
  stage.append(c.tag);
}

let state = { thinking: [], events: [], status: {} };
const played = new Set();
// Panels below the stage show only what has already been spoken on stage, so a replay
// rebuilds them in step with the bubbles. Keys match the server's event keys.
const revealed = new Set();
const queue = [];
let current = null; // { speaker, target, text, label, shown, started }
let paused = false;
let speed = 1; // 1×, 2× or 4× during a replay; live debates always play at 1×
let replaying = false;
const charMs = () => 30 / speed;
let lastStep = 0;

function connect() {
  const source = new EventSource("/events");
  source.onopen = () => { $("conn").className = "chip live"; $("conn").textContent = "live"; };
  source.onerror = () => { $("conn").className = "chip offline"; $("conn").textContent = "reconnecting"; };
  source.addEventListener("state", (e) => applyState(JSON.parse(e.data)));
}

function applyState(next) {
  state = next;
  $("topic").textContent = next.topic || "Model Debate";
  $("phase").textContent = next.phase;
  $("dir").textContent = next.dir;
  // Pinned model + thinking level from the server replace the built-in family names.
  for (const p of next.panelists || []) {
    const c = CHARACTERS[p.id];
    if (c && p.model) c.model = p.model;
  }
  updateTags();
  for (const ev of next.events) {
    if (played.has(ev.key)) continue;
    played.add(ev.key);
    for (const line of ev.lines) {
      queue.push({ key: ev.key, speaker: ev.speaker, target: line.target || null, text: line.text, label: ev.label, stance: ev.stance || null, narrator: narratorOf(ev.key) });
    }
  }
  renderPanels();
}

function renderPanels() {
  const facts = (state.facts || []).filter((f) => revealed.has("facts.md#" + f.id + ":" + f.status + ":" + f.claim));
  renderFacts($("facts"), facts);
  const synthesisShown = Boolean(state.synthesis && revealed.has("synthesis.md"));
  if (synthesisShown) renderMarkdown($("synthesis"), state.synthesis);
  else $("synthesis").replaceChildren(el("p", "empty", "No synthesis yet."));
  $("copy-synthesis").hidden = !synthesisShown;
  const reviews = (state.reviews || []).filter((r) => revealed.has("review" + r.round + "-" + r.speaker + ".md"));
  if (reviews.length) renderReviews($("reviews"), reviews);
  else $("reviews").replaceChildren(el("p", "empty", "No reviews yet."));
}

const STANCE_LABEL = { keep: "Holds", revise: "Revises", withdraw: "Withdraws" };

// "Rocky (Grok 4.7 Fast, medium) · 1:23" while running; retries and failures from status.json.
function updateTags() {
  const now = Date.now();
  for (const [id, c] of Object.entries(CHARACTERS)) {
    const s = (state.status || {})[id];
    let suffix = "";
    if (s && (s.state === "running" || s.state === "retrying") && s.startedAt) {
      const sec = Math.max(0, Math.floor((now - Date.parse(s.startedAt)) / 1000));
      suffix = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
      if (s.state === "retrying" || (s.attempt || 1) > 1) suffix += " · retry #" + (s.attempt || 2);
    } else if (s && s.state === "failed") {
      suffix = "failed";
    }
    c.tag.textContent = c.name + " (" + c.model + ")" + (suffix ? "\n" + suffix : "");
  }
}
setInterval(updateTags, 1000);

function renderFacts(box, facts) {
  if (!facts.length) { box.replaceChildren(el("p", "empty", "No facts checked yet.")); return; }
  box.replaceChildren();
  const ul = el("ul", "facts");
  for (const f of facts) {
    const li = el("li");
    li.append(el("span", "fact-mark " + f.status, f.status.toUpperCase()), el("strong", "", f.id + " "), f.claim);
    const meta = [f.quote && "“" + f.quote + "”", f.scope && "scope: " + f.scope, f.raiser && "raised by " + nameOf(f.raiser)].filter(Boolean);
    if (meta.length || f.source) {
      const q = el("span", "quote", meta.join(" · ") + (f.source ? (meta.length ? " · " : "") : ""));
      if (f.source) {
        const url = f.source.match(/https?:\/\/\S+/);
        if (url) {
          const a = el("a", "", "source");
          a.href = url[0];
          a.target = "_blank";
          a.rel = "noopener";
          q.append(a);
        } else {
          q.append(f.source);
        }
      }
      li.append(q);
    }
    ul.append(li);
  }
  box.append(ul);
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// Bold, inline code and http(s) links only; everything else stays plain text.
function inline(parent, text) {
  const re = /\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    parent.append(text.slice(last, m.index));
    if (m[1] !== undefined) parent.append(el("strong", "", m[1]));
    else if (m[2] !== undefined) parent.append(el("code", "", m[2]));
    else {
      const a = el("a", "", m[3]);
      a.href = m[4];
      a.target = "_blank";
      a.rel = "noopener";
      parent.append(a);
    }
    last = re.lastIndex;
  }
  parent.append(text.slice(last));
}

function renderMarkdown(box, md) {
  box.replaceChildren();
  let list = null;
  for (const raw of md.replace(/^---\n[\s\S]*?\n---\n/, "").split("\n")) {
    const line = raw.trimEnd();
    const item = line.match(/^\s*(?:([-*+])|\d+[.)])\s+(.*)/);
    if (item) {
      const tag = item[1] ? "UL" : "OL";
      if (!list || list.tagName !== tag) { list = el(tag); box.append(list); }
      const li = el("li");
      inline(li, item[2]);
      list.append(li);
      continue;
    }
    list = null;
    if (!line.trim()) continue;
    const heading = line.match(/^(#{1,6})\s+(.*)/);
    const tldr = /^TL;DR\s*[:：]/i.test(line);
    const node = el(heading ? "h" + Math.min(6, heading[1].length + 2) : "p", tldr ? "tldr" : "");
    inline(node, heading ? heading[2] : line);
    box.append(node);
  }
}

function renderReviews(box, reviews) {
  box.replaceChildren();
  const rounds = [...new Set(reviews.map((r) => r.round))];
  for (const round of rounds) {
    const inRound = reviews.filter((r) => r.round === round);
    const counts = { critical: 0, major: 0, minor: 0 };
    for (const r of inRound) for (const f of r.findings) if (f.severity) counts[f.severity]++;
    const title = el("h3", "", "Review " + round);
    title.append(el("span", "counts", "critical " + counts.critical + " · major " + counts.major + " · minor " + counts.minor));
    const cards = el("div", "cards");
    for (const r of inRound) {
      const c = CHARACTERS[r.speaker];
      const card = el("article", "card");
      const name = el("h4", "", c ? c.name + " (" + c.model + ")" : r.speaker);
      if (c) name.style.color = c.color;
      card.append(name);
      if (r.verdict) card.append(el("p", "verdict", r.verdict));
      const ul = el("ul");
      for (const f of r.findings) {
        const li = el("li");
        li.append(el("span", "sev " + (f.severity || "note"), f.severity || "note"), f.text);
        ul.append(li);
      }
      card.append(ul);
      cards.append(card);
    }
    box.append(title, cards);
  }
}

function nameOf(id) { return CHARACTERS[id] ? CHARACTERS[id].name : ""; }

function log(item) {
  const p = document.createElement("p");
  const meta = document.createElement("span");
  meta.className = "meta";
  const who = item.speaker ? nameOf(item.speaker) + (item.target ? " → " + nameOf(item.target) : "") : item.narrator ? NARRATORS[item.narrator].name : "Narrator";
  meta.textContent = "[" + item.label + "] " + who + (item.stance ? " (" + STANCE_LABEL[item.stance.kind] + ")" : "") + ": ";
  p.append(meta, item.text);
  if (item.stance && item.stance.reason) p.append(el("span", "meta", " — " + item.stance.reason));
  const box = $("log");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  box.append(p);
  if (atBottom) box.scrollTop = box.scrollHeight;
  if (item.key && !revealed.has(item.key)) {
    revealed.add(item.key);
    renderPanels();
  }
}

function holdMs(text) { return 1800 + text.length * 45; }

function step(now) {
  if (current) {
    const typing = reduceMotion.matches ? Infinity : (now - current.started) / charMs();
    current.shown = Math.min(current.text.length, Math.floor(typing));
    if (current.shown >= current.text.length && now - current.started > current.text.length * charMs() + holdMs(current.text) / speed) {
      current = null;
    }
  }
  updateFlyers(now);
  if (!current && queue.length) {
    // A narrator's lines wait until he has docked; whoever is docked but not speaking next leaves.
    const want = queue[0].narrator;
    for (const n of Object.keys(flyers)) if (n !== want && flyers[n].mode === "talk") fly(n, "exit", now);
    if (want && flyers[want].mode !== "talk") {
      if (flyers[want].mode !== "enter") fly(want, "enter", now);
      return;
    }
    current = Object.assign(queue.shift(), { shown: 0, started: now });
    log(current);
  }
  if (!current && !queue.length) for (const n of Object.keys(flyers)) if (flyers[n].mode === "talk") fly(n, "exit", now);
}

function renderBubble() {
  if (!current) { bubble.hidden = true; banner.hidden = true; return; }
  const text = current.text.slice(0, current.shown);
  if (current.narrator) {
    const N = NARRATORS[current.narrator];
    banner.hidden = true;
    $("badge").hidden = true;
    bubble.hidden = false;
    const verdict = current.text.match(/^[✓✗?] (VERIFIED|REFUTED|OPEN)/);
    bubble.className = "bubble from-top" + (verdict ? " fact-" + verdict[1].toLowerCase() : "");
    $("who").textContent = N.name + " · " + current.label;
    $("who").style.color = N.labelColor;
    $("said").textContent = text;
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const anchor = N.cx / W * sw;
    const left = Math.max(8, Math.min(sw - bubble.offsetWidth - 8, anchor - bubble.offsetWidth / 2));
    bubble.style.left = left + "px";
    bubble.style.bottom = "auto";
    bubble.style.top = ((N.top + N.sprite.length + 4) / H * sh) + "px";
    bubble.style.setProperty("--tail", (anchor - left) + "px");
    return;
  }
  bubble.className = "bubble";
  bubble.style.top = "auto";
  if (!current.speaker) {
    bubble.hidden = true;
    banner.hidden = false;
    banner.className = "banner";
    banner.textContent = "[" + current.label + "] " + text;
    return;
  }
  const badge = $("badge");
  badge.hidden = !current.stance;
  if (current.stance) {
    badge.className = "badge " + current.stance.kind;
    badge.textContent = STANCE_LABEL[current.stance.kind];
    badge.title = current.stance.reason || "";
  }
  banner.hidden = true;
  const c = CHARACTERS[current.speaker];
  bubble.hidden = false;
  $("who").textContent = c.name + (current.target ? " → " + nameOf(current.target) : "") + " · " + current.label;
  $("who").style.color = c.color;
  $("said").textContent = text;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const anchor = c.cx / W * sw;
  const left = Math.max(8, Math.min(sw - bubble.offsetWidth - 8, anchor - bubble.offsetWidth / 2));
  bubble.style.left = left + "px";
  bubble.style.bottom = ((H - (FLOOR - SPRITE_H) + 10) / H * sh) + "px";
  bubble.style.setProperty("--tail", (anchor - left) + "px");
}

function px(x, y, color, w = 1, h = 1) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }

function drawBackground() {
  px(0, 0, "#262a40", W, FLOOR);
  for (let x = 0; x < W; x += 8) px(x, 20, "#2d3250", 4, 1);
  for (let x = 0; x < W; x += 4) {
    for (let y = FLOOR; y < H; y += 4) px(x, y, ((x + y) / 4) % 2 ? "#3b3524" : "#463f2b", 4, 4);
  }
  px(0, FLOOR, "#5a5137", W, 1);
}

function drawCharacter(id, c, now) {
  const speaking = current && current.speaker === id;
  const targeted = current && current.target === id;
  const thinking = !speaking && !targeted && state.thinking.includes(id);
  const motion = !reduceMotion.matches && !paused;
  const tick = Math.floor(now / 160);
  let dy = 0;
  if (motion && speaking) dy = tick % 2 ? -2 : 0;
  else if (motion) dy = Math.floor(now / 600 + c.cx) % 2 ? -1 : 0;
  const x0 = c.cx - 8, y0 = FLOOR - SPRITE_H + dy;
  const dir = facing(id, c);

  px(c.cx - 6, FLOOR - 1, "rgba(0,0,0,0.35)", 12, 2);
  c.sprite.forEach((row, y) => {
    const hx = y < HEAD_ROWS ? dir : 0;
    for (let x = 0; x < row.length; x++) {
      const k = row[x];
      if (k !== ".") px(x0 + x + hx, y0 + y, c.palette[k]);
    }
  });
  // Gaze: pupils move one more pixel toward the partner, on top of the turned head.
  if (dir) {
    for (const [x, y] of c.eyes) px(x0 + x + dir, y0 + y, c.palette[c.eyeBg]);
    for (const [x, y] of c.eyes) px(x0 + x + 2 * dir, y0 + y, c.palette[c.sprite[y][x]]);
  }
  const ex = dir ? 2 * dir : 0;
  if (motion && now > c.blinkAt) {
    for (const [x, y] of c.eyes) px(x0 + x + ex, y0 + y, c.palette[c.lid]);
    if (now > c.blinkAt + 140) c.blinkAt = now + 2500 + Math.random() * 3500;
  }
  if (speaking && (!motion || tick % 2)) {
    for (const [x, y] of MOUTH) { px(x0 + x + dir, y0 + y, "#2a0f0a"); px(x0 + x + dir, y0 + y + 1, "#2a0f0a"); }
  }
  // Changing one's mind is a highlight, not a penalty: a lightbulb over the speaker's head.
  if (speaking && current.stance && current.stance.kind !== "keep") {
    const glow = !motion || Math.floor(now / 300) % 2;
    px(c.cx - 2, y0 - 10, glow ? "#fff3b0" : "#ffd166", 4, 4);
    px(c.cx - 1, y0 - 6, "#c9c9c9", 2, 2);
  }
  if (thinking) {
    const lit = motion ? Math.floor(now / 350) % 3 : -1;
    for (let i = 0; i < 3; i++) px(c.cx - 5 + i * 4, y0 - 5, i === lit ? "#ffffff" : "#8a8fb0", 2, 2);
  }
  if (targeted) {
    const flash = !motion || Math.floor(now / 400) % 2;
    if (flash) { px(c.cx - 1, y0 - 10, "#ffd166", 2, 5); px(c.cx - 1, y0 - 4, "#ffd166", 2, 2); }
  }
}

function frame(now) {
  if (!paused && now - lastStep > 33) { step(now); lastStep = now; }
  drawBackground();
  for (const [id, c] of Object.entries(CHARACTERS)) drawCharacter(id, c, now);
  for (const n of Object.keys(NARRATORS)) drawNarrator(n, now);
  renderBubble();
  const finished = debateFinished();
  // A replay ends when playback has caught up again; speed then returns to 1× for live play.
  if (replaying && finished) { replaying = false; setSpeed(1); }
  $("clear").disabled = !finished;
  $("replay").disabled = !finished;
  $("speed").disabled = !replaying;
  requestAnimationFrame(frame);
}

$("pause").addEventListener("click", (e) => {
  paused = !paused;
  e.currentTarget.textContent = paused ? "Play" : "Pause";
  e.currentTarget.setAttribute("aria-pressed", String(paused));
  if (!paused && current) current.started = performance.now() - current.shown * charMs();
});
// The debate is finished when the synthesis exists, no panelist is still working and the stage
// has played everything (nobody speaking, nothing queued, no narrator on screen).
function debateFinished() {
  return Boolean(state.synthesis) && !(state.thinking || []).length && !current && !queue.length &&
    Object.values(flyers).every((f) => f.mode === "gone");
}
// Clear: empty the transcript and every panel below the stage. Played files stay played, so
// nothing re-queues; Replay brings it all back.
$("clear").addEventListener("click", () => {
  replaying = false;
  setSpeed(1);
  current = null;
  queue.length = 0;
  flyers = resetFlyers();
  $("log").replaceChildren();
  revealed.clear();
  renderPanels();
});
// Replay: forget what has been played and run every finished file again from the brief
// (Round 1 → facts → Round 2 → synthesis → reviews), at the current speed.
$("replay").addEventListener("click", () => {
  replaying = true;
  current = null;
  queue.length = 0;
  played.clear();
  flyers = resetFlyers();
  $("log").replaceChildren();
  revealed.clear();
  renderPanels();
  if (paused) $("pause").click();
  applyState(state);
});
// Copies the synthesis exactly as written (Markdown), not the rendered text.
$("copy-synthesis").addEventListener("click", async (e) => {
  const button = e.currentTarget;
  try {
    await navigator.clipboard.writeText(state.synthesis || "");
    button.textContent = "Copied!";
  } catch {
    button.textContent = "Copy failed";
  }
  setTimeout(() => { button.textContent = "Copy"; }, 1500);
});
const SPEEDS = [1, 2, 4];
function setSpeed(next) {
  const now = performance.now();
  const shownAt = current ? current.shown : 0;
  speed = next;
  $("speed").textContent = "Speed " + speed + "×";
  // Keep the current line where it is instead of jumping ahead or back.
  if (current) current.started = now - shownAt * charMs();
}
$("speed").addEventListener("click", () => setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]));

connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
