symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 2
modelRoles:
  advisor: openai/gpt-6.1-sol:medium
  smol: cursor/grok-4.7:medium
  plan: openai-codex/gpt-6.1-sol:medium
  slow: openai/gpt-6.1-sol:medium
  default: anthropic/claude-opus-5-5:medium
statusLine:
  separator: powerline
  preset: default
defaultThinkingLevel: medium
hideThinkingBlock: false
bash:
  enabled: true
task:
  agentModelOverrides: {}
dev:
  autoqaConsent: granted
composer:
  shape: band
enabledProviders:
  - codex
  - claude
skills:
  customDirectories:
    - ~/.codex/skills
    - ~/.claude/skills/nx
    - ~/.claude/skills/.system
  enableClaudeUser: true
  enableCodexUser: true
commands:
  enableClaudeUser: true
retry:
  fallbackChains:
    default:
      - openai/gpt-6.1-sol